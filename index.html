<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .form-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        #status { margin-top: 10px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Register</h2>
    <form id="registerForm">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" required>
        </div>
        <button type="submit">Submit</button>
    </form>
    <div id="status"></div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(event) {
    event.preventDefault(); // Form reload hone se rokein

    // Bot details
    const botToken = "7060236112:AAEio0n738JSADTKDVZaai0cIfjX-pmw7no";
    const chatId = "6318395817";

    // Form inputs fetch karein
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;

    // Status display
    const statusDiv = document.getElementById("status");
    statusDiv.style.color = "black";
    statusDiv.innerText = "Sending...";

    // Telegram message format
    const message = `🚨 *New User Registered!* \n\n👤 *Name:* ${name}\n📧 *Email:* ${email}\n📱 *Phone:* ${phone}`;

    // Telegram API Endpoint
    const telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;

    // Fetch API request
    fetch(telegramUrl, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            chat_id: chatId,
            text: message,
            parse_mode: 'Markdown'
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.ok) {
            statusDiv.style.color = "green";
            statusDiv.innerText = "Registered Successfully!";
            document.getElementById("registerForm").reset();
        } else {
            statusDiv.style.color = "red";
            statusDiv.innerText = "Failed to send notification.";
        }
    })
    .catch(error => {
        console.error("Error:", error);
        statusDiv.style.color = "red";
        statusDiv.innerText = "Error sending data.";
    });
});
</script>

</body>
</html>
