<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI All-in-One Search Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      margin-bottom: 30px;
    }
    .search-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    input[type="text"] {
      flex: 1;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    .engine-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 600px;
    }
    .btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #334155;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover {
      background-color: #0284c7;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <h1>AI Search Engine Hub</h1>
  <p>Apna sawal likhein aur kisi bhi AI Engine par ek click mein search karein:</p>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Yahan apna query/question likhein..." onkeypress="handleKeyPress(event)">
  </div>

  <div class="engine-grid">
    <button class="btn" onclick="searchAI('perplexity')">Perplexity AI</button>
    <button class="btn" onclick="searchAI('chatgpt')">ChatGPT</button>
    <button class="btn" onclick="searchAI('gemini')">Google Gemini</button>
    <button class="btn" onclick="searchAI('claude')">Claude AI</button>
    <button class="btn" onclick="searchAI('phind')">Phind (Code)</button>
    <button class="btn" onclick="searchAI('google')">Google Search</button>
  </div>

  <script>
    function searchAI(engine) {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) {
        alert('Kripya search karne ke liye kuch text enter karein!');
        return;
      }

      const encodedQuery = encodeURIComponent(query);
      let url = '';

      switch(engine) {
        case 'perplexity':
          url = `https://www.perplexity.ai/search?q=${encodedQuery}`;
          break;
        case 'chatgpt':
          url = `https://chatgpt.com/?q=${encodedQuery}`;
          break;
        case 'gemini':
          url = `https://gemini.google.com/app`;
          break;
        case 'claude':
          url = `https://claude.ai/new`;
          break;
        case 'phind':
          url = `https://www.phind.com/search?q=${encodedQuery}`;
          break;
        case 'google':
          url = `https://www.google.com/search?q=${encodedQuery}`;
          break;
      }

      window.open(url, '_blank');
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        searchAI('perplexity');
      }
    }
  </script>

</body>
</html>
